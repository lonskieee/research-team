<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submission Confirmation</title>
  <style>
    :root {
      --primary-color: #0d5c3a;
      --text-main: #2d3748;
      --text-muted: #718096;
      --bg-color: #f7fafc;
      --card-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(rgba(238, 244, 239, 0.375), rgb(238, 244, 239)), url('/haha.png') center/cover no-repeat;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100vh;
      min-height: 0;
      overflow: hidden;
    }

    .container {
      width: min(655px, calc(100% - 2rem));
      height: min(560px, calc(100vh - 150px));
      margin: 0 auto 70px;
      padding: clamp(1rem, 3vw, 2rem);
      background: rgba(255, 253, 242, 0.98);
      border: 2px solid var(--primary-color);
      border-radius: 6px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3);
      text-align: center;
      flex: 0 0 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .icon-container {
      width: 70px;
      height: 70px;
      min-width: 70px;
      min-height: 70px;
      flex: 0 0 70px;
      background-color: #e6f4ea;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      flex-shrink: 0;
    }

    .checkmark {
      color: #137333;
      font-size: 2.5rem;
      font-weight: bold;
    }

    h1 {
      font-size: clamp(1.5rem, 4vw, 2rem);
      color: var(--primary-color);
      margin-bottom: 0.5rem;
    }

    .subtext {
      color: var(--text-muted);
      font-size: clamp(0.9rem, 2.5vw, 1.1rem);
      margin-bottom: clamp(0.5rem, 2vh, 1rem);
    }

    .team-image-container {
      width: 100%;
      max-width: 500px;
      margin-bottom: 0.5rem;
      height: clamp(120px, 24vh, 180px);
      flex: 0 0 clamp(120px, 24vh, 180px);
      min-height: 0;
    }

    .team-image-container img {
      width: 100%;
      height: 100%;
      image-rendering: auto;
      object-fit: contain;
      display: block;
    }

    .team-details {
      width: 100%;
      max-width: 450px;
      text-align: center;
      background: transparent;
      padding: 0;
      border: 0;
    }

    .leader {
      font-size: clamp(0.85rem, 2.2vw, 1.05rem);
      font-weight: 700;
      color: var(--primary-color);
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 0;
    }

    .members-title {
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }

    .team-members {
      list-style-type: none;
    }

    .team-members li {
      padding: 0.25rem 0;
      color: #4a5568;
    }

    footer {
      background-color: var(--primary-color);
      color: #ffffff;
      text-align: center;
      position: fixed;
      bottom: 0;
      width: 100%;
      padding: 0.6rem 1rem;
      font-size: clamp(0.7rem, 1.8vw, 0.95rem);
      margin-top: 0;
    }

    footer img {
      width: 58px;
      height: 58px;
      object-fit: contain;
      flex-shrink: 0;
      vertical-align: middle;
      margin-right: 0.6rem;
    }

    @media (max-height: 700px) {
      .container {
        padding: 1rem;
      }

      .icon-container {
        width: 52px;
        height: 52px;
        min-width: 52px;
        min-height: 52px;
        flex-basis: 52px;
        margin-bottom: 0.75rem;
      }

      .checkmark {
        font-size: 2rem;
      }

      h1 {
        font-size: 1.5rem;
      }

      .subtext {
        margin-bottom: 0.75rem;
      }

      .container {
        height: min(560px, calc(100vh - 120px));
        margin: 0 auto;
      }

      .team-image-container {
        height: clamp(110px, 22vh, 150px);
        flex-basis: clamp(110px, 22vh, 150px);
      }

      .team-image-container img {
        height: 100%;
      }

      .team-details {
        padding: 0.75rem 1rem;
      }

      .leader {
        margin-bottom: 0.5rem;
      }

      footer {
        padding: 0.75rem;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="icon-container">
      <span class="checkmark">&#10003;</span>
    </div>

    <h1>Submitted</h1>
    <p class="subtext">Thank you for your time, appreciated.</p>

    <div class="team-image-container">
      <img src="/Gemini_Generated_Image_oywvxcoywvxcoywv-removebg-preview.png" alt="5 Person Research Team Graphic">
    </div>

    <div class="team-details">
      <div class="leader">
        Research Team Leader: Marlon M. Sarabia Jr.
      </div>
      <div class="members-title">Team Members:</div>
      <ul class="team-members">
        <li>Marc Dann Aguinaldo</li>
        <li>Joash Jericho Cadiz</li>
        <li>Emanuel Langamen</li>
        <li>Judy Ann Paleracio</li>
      </ul>
    </div>
  </div>

  <footer>
    <img src="/footer logo.png" alt="MMSU logo">
    <span>Mariano Marcos State University - College of Industrial Technology Major in Computer Technology</span>
  </footer>

</body>
</html>
